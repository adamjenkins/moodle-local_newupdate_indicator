name: local_newupdate_indicator
summary: 'Highlights recently added and recently modified activities directly on the course page, so students can spot what''s new.'
description: |
  Shows "New" badges next to activities added within a configurable
  time-span and "Updated" badges next to recently modified ones, plus an
  optional recent-content list at the top of the course page summarising the
  newest items. Configurable site-wide, with optional per-course overrides.
